name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.7.0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Type Check
      run: pnpm exec tsc --noEmit

    - name: Run Lint
      run: pnpm run lint

    - name: Run Tests
      run: pnpm test
